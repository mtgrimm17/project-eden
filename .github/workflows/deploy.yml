# Publishes the game to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
# The playable URL will be https://<org>.github.io/project-eden/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Sanity-check JS syntax
        run: |
          for f in $(find src -name '*.js'); do node --check "$f"; done
          for f in $(find src -name '*.json'); do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"; done
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Smoke test (boots the game in Node)
        run: cd tools && npm install --no-audit --no-fund && node smoke-test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
